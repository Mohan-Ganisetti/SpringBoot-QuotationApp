<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Show Materials</title>
</head>
<body>
<h2>Medicals Data</h2>

<!-- check if map is not empty -->
<div th:if="${materials != null and !materials.isEmpty()}">
    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>Material Type</th>
                <th>Items</th>
                <th>Action </th>
            </tr>
        </thead>
       
        <tbody>
    <th:block th:each="entry : ${materials.entrySet()}">
        <th:block th:each="val : ${entry.value}">
            <tr>
                <td th:text="${entry.key}"></td>
                <td th:text="${val}"></td>
                <td>
                    <a th:href="@{/delete(type=${entry.key}, item=${val})}"
                       onclick="return confirm('Are you sure you want to delete this item?')">
                        Delete
                    </a>
                </td>
            </tr>
        </th:block>
    </th:block>
</tbody>

    </table>
</div>

<!-- empty case -->
<div th:if="${materials == null or materials.isEmpty()}">
    <p>No materials found.</p>
</div>

</body>
</html>
